<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="hbk/assets/logo.png" type="image/png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      width: 100%;
      background: #fafaf7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #1d1d56;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      min-height: 100vh;
    }

    .lobby__header {
      text-align: center;
      margin-bottom: 56px;
    }

    .lobby__eyebrow {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #888;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .lobby__title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #1d1d56;
    }

    .lobby__grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
      gap: 32px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .client-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      border: 1px solid #e8e8e0;
      border-radius: 18px;
      padding: 48px 36px;
      text-decoration: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      cursor: pointer;
      color: inherit;
    }

    .client-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.12);
      border-color: #d0d0c5;
    }

    .client-card:active {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.10);
    }

    .client-card__logo {
      width: 180px;
      height: 180px;
      max-width: 50vw;
      max-height: 50vw;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      background: #000;
      transition: transform 0.4s ease;
    }

    .client-card:hover .client-card__logo {
      transform: scale(1.03);
    }

    .client-card__name {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: #1d1d56;
      text-align: center;
    }

    .client-card__label {
      margin-top: 8px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    .client-card:hover .client-card__label {
      color: #6e57e0;
    }

    /* Placeholder card style for future clients */
    .client-card--placeholder {
      background: #f4f3ed;
      border-style: dashed;
      cursor: default;
      opacity: 0.65;
    }

    .client-card--placeholder:hover {
      transform: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      border-color: #e8e8e0;
    }

    .client-card--placeholder .client-card__logo {
      background: #d8d6cc;
    }

    @media (max-width: 480px) {
      body { padding: 40px 18px; }
      .lobby__header { margin-bottom: 36px; }
      .lobby__title { font-size: 26px; }
      .client-card { padding: 36px 28px; }
      .client-card__logo { width: 150px; height: 150px; }
    }
  </style>
</head>
<body>

  <header class="lobby__header">
    <p class="lobby__eyebrow">Client Portal</p>
    <h1 class="lobby__title">Select a site</h1>
  </header>

  <main class="lobby__grid">

    <!-- HBK Futsal — goes to the site-map portal, which then leads into the
         live site (portal.html "Open Live Site" → hbk/index.html) -->
    <a class="client-card" href="hbk/portal.html" aria-label="Open the HBK Futsal site map">
      <img class="client-card__logo" src="hbk/assets/logo.png" alt="HBK Futsal logo" />
      <p class="client-card__name">HBK Futsal</p>
      <p class="client-card__label">View Site Map</p>
    </a>

    <a class="client-card" href="bay-area-tree-service/index.html" aria-label="Enter Bay Area Tree Service website">
      <img class="client-card__logo" src="bay-area-tree-service/assets/img/favicon.svg" alt="Bay Area Tree Service logo" />
      <p class="client-card__name">Bay Area Tree Service</p>
      <p class="client-card__label">Enter Site</p>
    </a>
    <a class="client-card" href="kensei/index.html" aria-label="Kensei Judo">
      <img class="client-card__logo" src="kensei/assets/img/favicon.svg" alt="Kensei Judo logo" />
      <p class="client-card__name">Kensei Judo</p>
      <p class="client-card__label">Enter Site</p>
    </a>
    <!--
      To add another client, copy the block above and update:
        href, alt text, logo src, client name, and label.
      Example:
      <a class="client-card" href="client2/index.html">
        <img class="client-card__logo" src="client2/assets/logo.png" alt="Client 2 logo" />
        <p class="client-card__name">Client 2</p>
        <p class="client-card__label">Enter Site</p>
      </a>
    -->

  </main>

</body>
</html>
